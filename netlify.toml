# Configuración automática para Netlify (Tanks Arena 3D + Stripe Serverless)
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Redirección opcional para rutas limpias de API
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Redirección SPA para que cualquier ruta cargue el juego correctamente
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
